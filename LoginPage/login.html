
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MetroLink Sambhajinagar - Login</title>
    <!-- Login CSS -->
    <link rel="stylesheet" href="login.css">
    <!-- Main CSS (indec.css) -->
    <link rel="stylesheet" href="/Home/indec.css">
</head>
<body>

<!-- Header will load here -->
<div id="header"></div>

<div class="body-img">
    <div class="login-container">
    <h2>MetroLink Sambhajinagar</h2>
    <h3>User Login</h3>

    <form id="loginForm">
        <input type="text" id="mobile" placeholder="Enter Mobile Number" required>
        <input type="password" id="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>

    <p class="signup-link">
        New user? <a href="signup.html">Create Account</a>
    </p>

    <p id="message"></p>
</div>
</div>

<!-- Footer will load here -->
<div id="footer"></div>

<!-- JS -->
<script src="login.js"></script>
<script src="/header/headerfooter.js"></script>
</body>
</html>
