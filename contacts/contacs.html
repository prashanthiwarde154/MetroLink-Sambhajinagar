<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro Sambhaji Nagar - Contact Us</title>
<link rel="stylesheet" href="/Home/indec.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>




.container{
    max-width:1200px;
    margin:40px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    padding:20px;
}

.info-box,.form-box{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.info-box h2,.form-box h2{
    margin-bottom:20px;
    color:#002147;
}

.info-item{
    margin-bottom:20px;
    font-size:15px;
}

.info-item i{
    color:#002147;
    margin-right:10px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

input:focus, textarea:focus{
    outline:none;
    border-color:#002147;
}





.map{
    margin-top:40px;
}

iframe{
    width:100%;
    height:350px;
    border-radius:10px;
}

footer{
    background:#002147;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}

@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="header"></div>

<div class="container">

<div class="info-box">
<h2>Get in Touch</h2>

<div class="info-item">
<i class="fa fa-map-marker-alt"></i>
Metro-Link Sambhajinagar corporation LTD. Office,<br>
J-Tower Office no. 07 ,<br>
Chhatrapati Sambhaji Nagar (Aurangabad),<br>
Maharashtra – 431003, India
</div>

<div class="info-item">
<i class="fa fa-phone"></i>
+91-7350443048
</div>

<div class="info-item">
<i class="fa fa-envelope"></i>
info@metrosambhajinagar.in
</div>

<div class="info-item">
<i class="fa fa-headset"></i>
Customer Support: 9699253528 , 9322138423
</div>

</div>

<div class="form-box">
<h2>Feedback/Complains</h2>

<form onsubmit="return validateForm()">
<input type="text" id="name" placeholder="Your Name">
<input type="email" id="email" placeholder="Your Email">
<input type="text" id="subject" placeholder="Subject">
<textarea rows="5" id="message" placeholder="Your Message"></textarea>
<button type="submit" onclick="validateForm()">Submit</button>
</form>

</div>

</div>
<!-- MAP -->
<div class="map">
<iframe 
  src="https://maps.google.com/maps?q=19.8835,75.3335&z=13&ie=UTF8&iwloc=&output=embed"
  style="width:100%; height:350px; border:0;" 
  allowfullscreen=""
  loading="lazy">
</iframe>
</div>

<div id="footer"></div>
<script src="/header/headerfooter.js"></script>
<script>
function validateForm(){
    let name=document.getElementById("name").value;
    let email=document.getElementById("email").value;
    let message=document.getElementById("message").value;

    if(name==="" || email==="" || message===""){
        alert("Please fill all required fields!");
        return false;
    }

    alert("Message Sent Successfully to MetroLink Support Team!");
    return true;
}

</script>

</body>
</html>
