<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticket Preview | MCSC</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f8;
    }

    .ticket-container {
      max-width: 420px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .ticket-header {
      background: #f05420;
      color: #fff;
      padding: 16px;
      text-align: center;
      font-weight: 600;
    }

    .ticket-body {
      padding: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .row span {
      color: #555;
    }

    .route {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      margin: 20px 0;
    }

    .fare {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin: 15px 0;
      color: #0f172a;
    }

    .ticket-actions {
      display: flex;
      gap: 12px;
      padding: 16px;
    }

    .ticket-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .cancel-btn {
      background: #e5e7eb;
    }

    .confirm-btn {
      background: #f05420;
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="ticket-container">
    <div class="ticket-header">
      MCSC • Ticket Preview
    </div>

    <div class="ticket-body">
      <div class="row">
        <strong>Ticket ID</strong>
        <span id="ticketId">----</span>
      </div>

      <div class="row">
        <strong>Date</strong>
        <span id="ticketDate">----</span>
      </div>
      
          <div id="passengerSection">
            <h3>Passenger Details</h3>
            <div id="passengerFields"></div>
          </div>
      <div class="route" id="routeText">
        ---- → ----
      </div>

      <div class="row">
        <strong>Distance</strong>
        <span id="distanceText">-- KM</span>
      </div>

      <div class="fare">
        ₹ <span id="fareText">--</span>
      </div>

      <div class="row">
        <strong>Status</strong>
        <span>Pending</span>
      </div>
    </div>



    <div class="ticket-actions">
      <button class="cancel-btn" id="cancelBtn">Cancel</button>
      <button class="confirm-btn" id="confirmBtn" type="button">
  Confirm Journey
</button>
      <!-- <button id="confirmJourneyBtn" type="button">Confirm Journey</button> -->
      <!-- <button class="confirm-btn" id="confirmBtn">Confirm Journey</button> -->
    </div>
  </div>

<script src="/ticket-info/ticket-preview.js"></script>
</body>
</html>
