<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetroLink Sambhajinagar - Fare Calculator</title>
<link rel="stylesheet" href="/Home/indec.css">
<style>

/* ===== BACKGROUND ===== */
/* body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#87CEEB,#ffffff,#FFD700);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
} */

/* ===== MAIN CARD ===== */
.calculator{
    width:420px;
    /* background:white; */
    border-radius:25px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
        background: linear-gradient(135deg,#87CEEB,#ffffff,#FFD700);
    /* display:flex;
    flex-direction: column; */
    align-self: center;
    justify-self: center;
    justify-content:center;
    align-items:center;
}

/* HEADER */
.header{
    background:#00A8E8;
    color:white;
    padding:12px 20px;
    border-radius:30px;
    text-align:center;
    font-weight:bold;
    font-size:18px;
    margin-bottom:25px;
}

/* INPUT BOX */
.input-group{
    margin-bottom:20px;
}

label{
    font-size:14px;
    color:#555;
}

select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
}

/* BUTTONS */
.buttons{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.reset{
    color:red;
    cursor:pointer;
    font-weight:bold;
}

.getfare{
    background:#2d3e50;
    color:white;
    padding:10px 25px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.getfare:hover{
    background:#1f2a36;
}

/* RESULT SECTION */
.result{
    margin-top:25px;
    padding:20px;
    background:#f3f6fa;
    border-radius:20px;
}

.result h3{
    color:#00A8E8;
    margin-bottom:15px;
}

.result-box{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.box{
    flex:1;
    background:white;
    padding:15px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.box span{
    display:block;
    font-size:14px;
    color:#555;
}

.box strong{
    font-size:20px;
    color:#000;
}

</style>
</head>

<body>
<div id="header"></div>
<div class="calculator">

<div class="header">Fare Calculator</div>

<div class="input-group">
<label>From</label>
<select id="from">
<option value="">Select Station</option>
<option value="0">WALUJ MIDC</option>
<option value="2">AS CLUB</option>
<option value="4">NAGAR NAKA</option>
<option value="6">PANCHAVATI HOTEL</option>
<option value="8">DISTRIC COURT</option>
<option value="10">KRANTI CHOWK</option>
<option value="12">AKASHWANI</option>
<option value="14">SEVEN HILL</option>
<option value="16">CIDCO BUS STAND</option>
<option value="18">CHIKHALTHANA</option>
<option value="20">SHENDRA MIDC</option>
</select>
</div>

<div class="input-group">
<label>To</label>
<select id="to">
<option value="">Select Station</option>
<option value="0">WALUJ MIDC</option>
<option value="2">AS CLUB</option>
<option value="4">NAGAR NAKA</option>
<option value="6">PANCHAVATI HOTEL</option>
<option value="8">DISTRIC COURT</option>
<option value="10">KRANTI CHOWK</option>
<option value="12">AKASHWANI</option>
<option value="14">SEVEN HILL</option>
<option value="16">CIDCO BUS STAND</option>
<option value="18">CHIKHALTHANA</option>
<option value="20">SHENDRA MIDC</option>
</select>
</div>

<div class="buttons">
<div class="reset" onclick="resetFare()">RESET</div>
<button class="getfare" onclick="calculateFare()">GET FARE</button>
</div>

<div class="result" id="result" style="display:none;">
<h3>FARE & JOURNEY DETAILS</h3>

<div class="result-box">
<div class="box">
<span>Journey Fare</span>
<strong id="fare">₹ 0</strong>
</div>

<div class="box">
<span>Distance</span>
<strong id="distance">0 km</strong>
</div>
</div>

</div>

</div>
<div id="footer"></div>
<script src="/header/headerfooter.js"></script>
<script>

function calculateFare(){

    let from = document.getElementById("from").value;
    let to = document.getElementById("to").value;

    if(from === "" || to === ""){
        alert("Please select both stations");
        return;
    }

    if(from === to){
        alert("Source and destination cannot be same");
        return;
    }

    let distance = Math.abs(to - from);

    // Simple fare logic
    let fare = 10 + (distance * 5);

    document.getElementById("fare").innerText = "₹ " + fare;
    document.getElementById("distance").innerText = distance + " km";

    document.getElementById("result").style.display = "block";
}

function resetFare(){
    document.getElementById("from").value="";
    document.getElementById("to").value="";
    document.getElementById("result").style.display="none";
}

</script>

</body>
</html>
